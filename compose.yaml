services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: audit_log
      POSTGRES_USER: audit_app
      POSTGRES_PASSWORD: local-development-password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit_app -d audit_log"]
      interval: 5s
      timeout: 5s
      retries: 10
