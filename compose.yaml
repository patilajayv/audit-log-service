services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: audit_log
      POSTGRES_USER: audit_migrator
      POSTGRES_PASSWORD: local-migrator-password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit_migrator -d audit_log"]
      interval: 5s
      timeout: 5s
      retries: 10
